[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "domscope"
version = "0.1.0"
description = "Offline HTML structure overlap and label conflict auditing"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["html5lib==1.1", "streamlit>=1.49,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
domscope = "domscope.__main__:main"

[tool.setuptools.packages.find]
include = ["domscope*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

